<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jam WIB</title>
</head>

<body>

<h2>JAM WIB</h2>
<div id="clock">00:00:00.000</div>

<script>
function updateClock() {
    var now = new Date();

    // Hitung WIB (UTC+7)
    var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    var wib = new Date(utc + (3600000 * 7));

    var h = wib.getHours();
    var m = wib.getMinutes();
    var s = wib.getSeconds();
    var ms = wib.getMilliseconds();

    if (h < 10) h = "0" + h;
    if (m < 10) m = "0" + m;
    if (s < 10) s = "0" + s;

    ms = String(ms);
    while (ms.length < 3) {
        ms = "0" + ms;
    }

    document.getElementById("clock").innerHTML =
        h + ":" + m + ":" + s + "." + ms;
}

setInterval(updateClock, 10);
updateClock();
</script>

</body>
</html>
